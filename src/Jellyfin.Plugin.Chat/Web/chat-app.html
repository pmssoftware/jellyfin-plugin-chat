<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jellyfin Chat</title>
<style>
:root{color-scheme:dark;--bg:#101316;--surface:#1b2025;--surface2:#242b31;--border:rgba(255,255,255,.12);--text:#f2f4f5;--muted:#abb5bc;--accent:#00a4dc;--danger:#e36d6d}*{box-sizing:border-box}html,body{height:100%}body{margin:0;padding:clamp(.75rem,2vw,1.5rem);background:transparent;color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{height:calc(100vh - clamp(1.5rem,4vw,3rem));min-height:30rem;max-width:90rem;margin:auto;display:grid;grid-template-columns:minmax(12rem,18rem) 1fr;border:1px solid var(--border);border-radius:1rem;overflow:hidden;background:rgba(16,19,22,.94);box-shadow:0 1rem 3rem rgba(0,0,0,.22)}.channels{padding:1rem;border-right:1px solid var(--border);overflow:auto}.brand{margin:.2rem .45rem 1rem;font-size:1.25rem}.channel{display:block;width:100%;padding:.75rem;border:0;border-radius:.55rem;background:transparent;color:var(--text);text-align:left;font:inherit;cursor:pointer}.channel:hover,.channel.active{background:var(--surface2)}.channel strong{display:block}.channel small{display:block;margin-top:.2rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{min-width:0;display:grid;grid-template-rows:auto 1fr auto}.header{padding:1rem 1.25rem;border-bottom:1px solid var(--border)}.header h1{margin:0;font-size:1.3rem}.header p{margin:.2rem 0 0;color:var(--muted)}.messages{overflow:auto;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:.8rem}.message{padding:.75rem .9rem;border-radius:.7rem;background:var(--surface);overflow-wrap:anywhere}.message-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.25rem}.message-author{font-weight:700}.message-time{color:var(--muted);font-size:.82rem}.message-body{white-space:pre-wrap}.message-actions{margin-left:auto;display:flex;gap:.35rem}.mini{border:0;border-radius:.35rem;background:rgba(255,255,255,.09);color:var(--muted);padding:.25rem .45rem;cursor:pointer}.mini:hover{color:var(--text)}.empty,.status{color:var(--muted);text-align:center;margin:auto}.composer{padding:1rem 1.25rem;border-top:1px solid var(--border)}.composer form{display:flex;gap:.65rem}.composer textarea{flex:1;min-height:3rem;max-height:10rem;resize:vertical;border:1px solid var(--border);border-radius:.55rem;background:var(--surface2);color:var(--text);padding:.75rem;font:inherit}.composer button{align-self:stretch;min-width:6rem;border:0;border-radius:.55rem;background:var(--accent);color:white;font-weight:700;cursor:pointer}.composer button:disabled,.composer textarea:disabled{opacity:.55;cursor:not-allowed}.notice{margin:.55rem 0 0;color:var(--muted);font-size:.88rem}.error{color:#ff9696}@media(max-width:45rem){body{padding:0}.shell{height:100vh;min-height:0;border:0;border-radius:0;grid-template-columns:7.5rem 1fr}.channels{padding:.6rem}.brand{font-size:1rem}.channel{padding:.65rem .45rem}.channel small{display:none}.header,.messages,.composer{padding-left:.8rem;padding-right:.8rem}.composer form{display:block}.composer button{width:100%;min-height:2.7rem;margin-top:.5rem}}
</style>
</head>
<body>
<main class="shell"><aside class="channels"><h2 class="brand">Jellyfin Chat</h2><div id="channelList"></div></aside><section class="chat"><header class="header"><h1 id="channelName">Chat</h1><p id="channelDescription"></p></header><div id="messages" class="messages"><p class="status">Loading…</p></div><footer class="composer"><form id="messageForm"><textarea id="messageBody" rows="2" placeholder="Write a message" required></textarea><button id="sendButton" type="submit">Send</button></form><p id="notice" class="notice" role="status"></p></footer></section></main>
<script>
(()=>{'use strict';
const dictionaries={en:{brand:'Jellyfin Chat',loading:'Loading…',empty:'No messages yet. Start the conversation.',write:'Write a message',send:'Send',sending:'Sending…',loadFailed:'Chat could not be loaded.',disabled:'Chat has not been enabled for your Jellyfin account.',sendFailed:'The message could not be sent.',muted:'You have been muted from this chat.',announcement:'Only administrators can post in this announcement channel.',delete:'Delete',mute:'Mute',confirmDelete:'Delete this message?',confirmMute:'Mute this user from chat?'},de:{brand:'Jellyfin Chat',loading:'Wird geladen…',empty:'Noch keine Nachrichten. Beginne die Unterhaltung.',write:'Nachricht schreiben',send:'Senden',sending:'Wird gesendet…',loadFailed:'Der Chat konnte nicht geladen werden.',disabled:'Der Chat wurde für dein Jellyfin-Konto nicht freigeschaltet.',sendFailed:'Die Nachricht konnte nicht gesendet werden.',muted:'Du wurdest in diesem Chat stummgeschaltet.',announcement:'Nur Administratoren können in diesem Ankündigungskanal schreiben.',delete:'Löschen',mute:'Stummschalten',confirmDelete:'Diese Nachricht löschen?',confirmMute:'Diesen Benutzer im Chat stummschalten?'}};
function language(){const values=[navigator.language];try{values.unshift(window.parent.localStorage.getItem('language'),window.parent.document.documentElement.lang)}catch(_){}return values.some(value=>String(value||'').toLowerCase().startsWith('de'))?'de':'en'}
const lang=language(),text=dictionaries[lang],list=document.querySelector('#channelList'),messages=document.querySelector('#messages'),nameNode=document.querySelector('#channelName'),description=document.querySelector('#channelDescription'),form=document.querySelector('#messageForm'),body=document.querySelector('#messageBody'),send=document.querySelector('#sendButton'),notice=document.querySelector('#notice'),messageCache=new Map(),lastFullLoad=new Map();let bootstrap=null,active=null,timer=null,busy=false,initialized=false;
document.documentElement.lang=lang;document.querySelector('.brand').textContent=text.brand;body.placeholder=text.write;send.textContent=text.send;
function client(){try{return window.parent&&window.parent.ApiClient?window.parent.ApiClient:window.ApiClient}catch(_){return window.ApiClient}}
function value(item,key){return item[key]??item[key.charAt(0).toLowerCase()+key.slice(1)]}
async function request(path,options={}){const api=client();if(!api)throw new Error('No session');const response=await api.ajax({url:api.getUrl(path),type:options.type||'GET',data:options.data?JSON.stringify(options.data):undefined,headers:{Accept:'application/json',...(options.data?{'Content-Type':'application/json'}:{})}});if(response.status===204)return null;return response.json()}
function renderChannels(){list.replaceChildren();bootstrap.Channels.forEach(channel=>{const button=document.createElement('button');button.type='button';button.className='channel'+(active&&value(active,'Id')===value(channel,'Id')?' active':'');const strong=document.createElement('strong');strong.textContent=(value(channel,'Kind')==='Announcement'?'📣 ':'# ')+value(channel,'Name');const small=document.createElement('small');small.textContent=value(channel,'Description')||'';button.append(strong,small);button.addEventListener('click',()=>selectChannel(channel));list.appendChild(button)})}
function setComposer(){const announcement=active&&value(active,'Kind')==='Announcement'&&!bootstrap.IsAdministrator;const disabled=bootstrap.IsMuted||announcement||!active;body.disabled=disabled;send.disabled=disabled;notice.className='notice';notice.textContent=bootstrap.IsMuted?text.muted:announcement?text.announcement:''}
async function selectChannel(channel){active=channel;nameNode.textContent=value(channel,'Name');description.textContent=value(channel,'Description')||'';renderChannels();setComposer();await loadMessages()}
function action(label,onClick){const button=document.createElement('button');button.type='button';button.className='mini';button.textContent=label;button.addEventListener('click',onClick);return button}
function renderMessages(items){const nearBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<100;messages.replaceChildren();if(!items.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=text.empty;messages.appendChild(empty);return}items.forEach(item=>{const card=document.createElement('article');card.className='message';const head=document.createElement('div');head.className='message-head';const author=document.createElement('span');author.className='message-author';author.textContent=value(item,'AuthorName');const time=document.createElement('time');time.className='message-time';time.textContent=new Date(value(item,'CreatedAtUtc')).toLocaleString(lang==='de'?'de-DE':'en-US');head.append(author,time);if(bootstrap.IsAdministrator){const actions=document.createElement('span');actions.className='message-actions';actions.append(action(text.delete,async()=>{if(!confirm(text.confirmDelete))return;await request('JellyfinChat/Messages/'+encodeURIComponent(value(item,'Id')),{type:'DELETE'});loadMessages(true)}));const authorId=value(item,'AuthorId');if(authorId)actions.append(action(text.mute,async()=>{if(!confirm(text.confirmMute))return;await request('JellyfinChat/Mutes',{type:'POST',data:{UserId:authorId,UserName:value(item,'AuthorName'),Reason:''}})}));head.appendChild(actions)}const content=document.createElement('div');content.className='message-body';content.textContent=value(item,'Body');card.append(head,content);messages.appendChild(card)});if(nearBottom)messages.scrollTop=messages.scrollHeight}
function isOpen(){if(document.visibilityState==='hidden')return false;try{const frame=window.frameElement;if(!frame)return true;if(frame.hidden||frame.getAttribute('aria-hidden')==='true'||frame.offsetParent===null)return false;const pane=frame.closest('[id^="customTab_"]');if(pane&&(pane.hidden||pane.getAttribute('aria-hidden')==='true'||pane.offsetParent===null))return false;const rect=frame.getBoundingClientRect();return rect.width>0&&rect.height>0}catch(_){return true}}
async function loadMessages(forceFull){if(!isOpen()||!active||busy)return;busy=true;try{const channelId=value(active,'Id'),cached=messageCache.get(channelId)||[],full=!!forceFull||!messageCache.has(channelId)||Date.now()-(lastFullLoad.get(channelId)||0)>60000;let path='JellyfinChat/Messages?channelId='+encodeURIComponent(channelId)+'&limit=100';if(!full&&cached.length)path+='&afterUtc='+encodeURIComponent(value(cached[cached.length-1],'CreatedAtUtc'));const incoming=await request(path);let combined;if(full){combined=incoming;lastFullLoad.set(channelId,Date.now())}else{const known=new Set(cached.map(item=>value(item,'Id')));combined=cached.concat(incoming.filter(item=>!known.has(value(item,'Id')))).slice(-200)}messageCache.set(channelId,combined);renderMessages(combined)}catch(error){console.error('Jellyfin Chat: load failed',error);messages.textContent=text.loadFailed}finally{busy=false}}
function schedulePoll(){if(timer)window.clearTimeout(timer);const delay=bootstrap?(bootstrap.PollIntervalMilliseconds??bootstrap.pollIntervalMilliseconds??2500):500;timer=window.setTimeout(async()=>{if(isOpen()){if(!initialized)await initialize();else await loadMessages()}schedulePoll()},delay)}
async function initialize(){if(initialized||!isOpen())return;initialized=true;try{bootstrap=await request('JellyfinChat/Bootstrap');bootstrap.Channels=bootstrap.Channels??bootstrap.channels??[];bootstrap.IsAdministrator=bootstrap.IsAdministrator??bootstrap.isAdministrator??false;bootstrap.IsMuted=bootstrap.IsMuted??bootstrap.isMuted??false;bootstrap.IsEnabled=bootstrap.IsEnabled??bootstrap.isEnabled??false;bootstrap.MessageLimit=bootstrap.MessageLimit??bootstrap.messageLimit??1000;body.maxLength=bootstrap.MessageLimit;if(!bootstrap.IsEnabled){messages.textContent=text.disabled;body.disabled=true;send.disabled=true;return}if(bootstrap.Channels.length)await selectChannel(bootstrap.Channels[0]);else renderChannels()}catch(error){initialized=false;console.error('Jellyfin Chat: initialization failed',error);messages.textContent=text.loadFailed}}
form.addEventListener('submit',async event=>{event.preventDefault();const message=body.value.trim();if(!message||!active)return;send.disabled=true;send.textContent=text.sending;notice.textContent='';try{await request('JellyfinChat/Messages',{type:'POST',data:{ChannelId:value(active,'Id'),Body:message}});body.value='';await loadMessages()}catch(error){console.error('Jellyfin Chat: send failed',error);notice.className='notice error';notice.textContent=text.sendFailed}finally{send.disabled=false;send.textContent=text.send;setComposer()}});
body.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});window.addEventListener('beforeunload',()=>{if(timer)clearTimeout(timer)});document.addEventListener('visibilitychange',()=>{if(isOpen()&&!initialized)initialize()});schedulePoll();
})();
</script>
</body></html>
