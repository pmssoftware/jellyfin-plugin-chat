<main class="shell"><aside class="channels"><h2 class="brand">Jellyfin Chat</h2><button id="newPrivate" class="new-private" type="button">＋ New private chat</button><div id="channelList"></div></aside><section class="chat"><header class="header"><h1 id="channelName">Chat</h1><p id="channelDescription"></p><p id="securityStatus" class="security"></p></header><div id="messages" class="messages"><p class="status">Loading…</p></div><footer class="composer"><form id="messageForm"><textarea id="messageBody" rows="2" placeholder="Write a message" required></textarea><button id="sendButton" type="submit">Send</button></form><p id="notice" class="notice" role="status"></p></footer></section></main>

<script>
(()=>{'use strict';
 const dictionaries={en:{brand:'Jellyfin Chat',loading:'Loading…',empty:'No encrypted messages yet. Start the conversation.',write:'Write a message',send:'Send',sending:'Encrypting…',loadFailed:'Encrypted chat could not be loaded.',secureContextRequired:'End-to-end encryption requires HTTPS or localhost. This HTTP address cannot securely load the chat.',secureStorageUnavailable:'This browser does not provide the secure local storage required for encrypted chat.',disabled:'Chat has not been enabled for your Jellyfin account.',sendFailed:'The encrypted message could not be sent.',muted:'You have been muted from this chat.',announcement:'Only administrators can post in this announcement channel.',privateWaiting:'Waiting for every participant to join the encrypted chat.',delete:'Delete',mute:'Mute',confirmDelete:'Delete this message?',confirmMute:'Mute this user from chat?',secure:'🔒 End-to-end encrypted · MLS 1.0 · experimental',devices:'devices',code:'security code',waiting:'🔐 Waiting for an active encrypted device to share the channel key…',newPrivate:'＋ New private chat',noUsers:'No eligible users are available.',chooseUser:'Choose a user:',openPrivateFailed:'Could not open private chat.',publicName:'Public',publicDescription:'The shared chat for everyone on this Jellyfin server.',announcementsName:'Announcements',announcementsDescription:'News and notices from the administrators.',privateDescription:'Private conversation'},de:{brand:'Jellyfin Chat',loading:'Wird geladen…',empty:'Noch keine verschlüsselten Nachrichten. Beginne die Unterhaltung.',write:'Nachricht schreiben',send:'Senden',sending:'Wird verschlüsselt…',loadFailed:'Der verschlüsselte Chat konnte nicht geladen werden.',secureContextRequired:'Die Ende-zu-Ende-Verschlüsselung benötigt HTTPS oder localhost. Über diese HTTP-Adresse kann der Chat nicht sicher geladen werden.',secureStorageUnavailable:'Dieser Browser stellt den für den verschlüsselten Chat benötigten sicheren lokalen Speicher nicht bereit.',disabled:'Der Chat wurde für dein Jellyfin-Konto nicht freigeschaltet.',sendFailed:'Die verschlüsselte Nachricht konnte nicht gesendet werden.',muted:'Du wurdest in diesem Chat stummgeschaltet.',announcement:'Nur Administratoren können in diesem Ankündigungskanal schreiben.',privateWaiting:'Warte, bis alle Teilnehmer dem verschlüsselten Chat beigetreten sind.',delete:'Löschen',mute:'Stummschalten',confirmDelete:'Diese Nachricht löschen?',confirmMute:'Diesen Benutzer im Chat stummschalten?',secure:'🔒 Ende-zu-Ende-verschlüsselt · MLS 1.0 · experimentell',devices:'Geräte',code:'Sicherheitscode',waiting:'🔐 Warte darauf, dass ein aktives verschlüsseltes Gerät den Kanalschlüssel teilt…',newPrivate:'＋ Privaten Chat starten',noUsers:'Keine berechtigten Benutzer verfügbar.',chooseUser:'Benutzer auswählen:',openPrivateFailed:'Der private Chat konnte nicht geöffnet werden.',publicName:'Öffentlich',publicDescription:'Der gemeinsame Chat für alle auf diesem Jellyfin-Server.',announcementsName:'Ankündigungen',announcementsDescription:'Neuigkeiten und Hinweise der Administratoren.',privateDescription:'Private Unterhaltung'}};
function language(){const values=[navigator.language];try{values.unshift(window.parent.localStorage.getItem('language'),window.parent.document.documentElement.lang)}catch(_){}return values.some(value=>String(value||'').toLowerCase().startsWith('de'))?'de':'en'}
const lang=language(),text=dictionaries[lang],sectionLabels=lang==='de'?{server:'Serverkanäle',direct:'Direkte Chats',groups:'Gruppen'}:{server:'Server channels',direct:'Direct messages',groups:'Groups'},list=document.querySelector('#channelList'),messages=document.querySelector('#messages'),nameNode=document.querySelector('#channelName'),description=document.querySelector('#channelDescription'),security=document.querySelector('#securityStatus'),form=document.querySelector('#messageForm'),body=document.querySelector('#messageBody'),send=document.querySelector('#sendButton'),notice=document.querySelector('#notice'),newPrivate=document.querySelector('#newPrivate'),avatar=document.createElement('img');avatar.className='private-avatar';avatar.alt='';avatar.hidden=true;avatar.addEventListener('error',()=>{avatar.hidden=true});document.querySelector('.header').append(avatar);let bootstrap=null,active=null,timer=null,channelTimer=null,busy=false,initialized=false,encryptedClient=null,secureState='loading',participantsReady=true;
const closePrivate=document.createElement('button');closePrivate.type='button';closePrivate.className='close-private';closePrivate.textContent=lang==='de'?'Chat löschen':'Delete chat';closePrivate.hidden=true;const blockPrivate=document.createElement('button');blockPrivate.type='button';blockPrivate.className='close-private';blockPrivate.style.right='10rem';blockPrivate.textContent=lang==='de'?'Blockieren':'Block';blockPrivate.hidden=true;document.querySelector('.header').append(blockPrivate,closePrivate);
document.documentElement.lang=lang;document.querySelector('.brand').textContent=text.brand;messages.textContent=text.loading;body.placeholder=text.write;send.textContent=text.send;newPrivate.textContent=text.newPrivate;
function client(){try{return window.parent&&window.parent.ApiClient?window.parent.ApiClient:window.ApiClient}catch(_){return window.ApiClient}}
function value(item,key){return item[key]??item[key.charAt(0).toLowerCase()+key.slice(1)]}
function channelName(channel){const name=value(channel,'Name');if(value(channel,'IsDefault')&&name==='Public')return text.publicName;if(value(channel,'IsDefault')&&name==='Announcements')return text.announcementsName;return name}
function channelDescription(channel){const description=value(channel,'Description')||'';if(value(channel,'IsPrivate')&&description==='Private conversation')return text.privateDescription;if(description==='The shared chat for everyone on this Jellyfin server.')return text.publicDescription;if(description==='News and notices from the administrators.')return text.announcementsDescription;return description}
function errorDetail(error){const detail=String(error?.message||'').trim();return detail?` (${detail})`:''}
function errorText(error){return error?.code==='secure-context-required'?text.secureContextRequired:error?.code==='secure-storage-unavailable'?text.secureStorageUnavailable:text.loadFailed+errorDetail(error)}
async function request(path,options={}){const api=client();if(!api)throw new Error('No session');const response=await api.ajax({url:api.getUrl(path),type:options.type||'GET',data:options.data?JSON.stringify(options.data):undefined,headers:{Accept:'application/json',...(options.data?{'Content-Type':'application/json'}:{})}});if(response.status===204)return null;return response.json()}
function askUsername(){return new Promise(resolve=>{const backdrop=document.createElement('div');backdrop.className='chat-dialog-backdrop';const dialog=document.createElement('form');dialog.className='chat-dialog';dialog.innerHTML=`<h2>${lang==='de'?'Privaten Chat starten':'Start private chat'}</h2><p>${lang==='de'?'Gib den exakten Jellyfin-Benutzernamen ein.':'Enter the exact Jellyfin username.'}</p><input type="text" maxlength="100" autocomplete="off" spellcheck="false" aria-label="${lang==='de'?'Benutzername':'Username'}"><div class="chat-dialog-actions"><button type="button">${lang==='de'?'Abbrechen':'Cancel'}</button><button class="primary" type="submit">${lang==='de'?'Chat starten':'Start chat'}</button></div>`;const input=dialog.querySelector('input'),cancel=dialog.querySelector('button[type="button"]');const finish=valueText=>{backdrop.remove();resolve(valueText)};cancel.addEventListener('click',()=>finish(null));backdrop.addEventListener('click',event=>{if(event.target===backdrop)finish(null)});dialog.addEventListener('submit',event=>{event.preventDefault();finish(input.value.trim()||null)});dialog.addEventListener('keydown',event=>{if(event.key==='Escape')finish(null)});backdrop.append(dialog);document.body.append(backdrop);input.focus()})}
function confirmDialog(title,body,yesLabel){return new Promise(resolve=>{const backdrop=document.createElement('div');backdrop.className='chat-dialog-backdrop';const dialog=document.createElement('div');dialog.className='chat-dialog';dialog.innerHTML=`<h2>${title}</h2><p>${body}</p><div class="chat-dialog-actions"><button type="button" data-answer="no">${lang==='de'?'Abbrechen':'Cancel'}</button><button class="primary" type="button" data-answer="yes">${yesLabel}</button></div>`;const finish=answer=>{backdrop.remove();resolve(answer)};dialog.querySelector('[data-answer="no"]').addEventListener('click',()=>finish(false));dialog.querySelector('[data-answer="yes"]').addEventListener('click',()=>finish(true));backdrop.addEventListener('click',event=>{if(event.target===backdrop)finish(false)});dialog.addEventListener('keydown',event=>{if(event.key==='Escape')finish(false)});backdrop.append(dialog);document.body.append(backdrop);dialog.querySelector('[data-answer="no"]').focus()})}
function confirmPrivateDeletion(){return new Promise(resolve=>{const backdrop=document.createElement('div');backdrop.className='chat-dialog-backdrop';const dialog=document.createElement('div');dialog.className='chat-dialog';dialog.innerHTML=`<h2>${lang==='de'?'Privaten Chat löschen?':'Delete private chat?'}</h2><p>${lang==='de'?'Der Chat und sein Nachrichtenverlauf werden für beide Teilnehmer dauerhaft gelöscht.':'The chat and its message history will be permanently deleted for both participants.'}</p><div class="chat-dialog-actions"><button type="button" data-answer="cancel">${lang==='de'?'Abbrechen':'Cancel'}</button><button class="primary" type="button" data-answer="delete">${lang==='de'?'Für beide löschen':'Delete for both'}</button></div>`;const finish=answer=>{backdrop.remove();resolve(answer)};dialog.querySelector('[data-answer="cancel"]').addEventListener('click',()=>finish(false));dialog.querySelector('[data-answer="delete"]').addEventListener('click',()=>finish(true));backdrop.addEventListener('click',event=>{if(event.target===backdrop)finish(false)});dialog.addEventListener('keydown',event=>{if(event.key==='Escape')finish(false)});backdrop.append(dialog);document.body.append(backdrop);dialog.querySelector('[data-answer="cancel"]').focus()})}
newPrivate.addEventListener('click',async()=>{try{const userName=await askUsername();if(!userName)return;const channel=await request('JellyfinChat/PrivateChat',{type:'POST',data:{UserName:userName}});if(!channel)return;if(!bootstrap.Channels.some(item=>value(item,'Id')===value(channel,'Id')))bootstrap.Channels.push(channel);await selectChannel(channel)}catch(error){notice.className='notice error';notice.textContent=text.openPrivateFailed}});
function renderChannels(){list.replaceChildren();const groups=[[sectionLabels.server,bootstrap.Channels.filter(channel=>!value(channel,'IsPrivate')&&!value(channel,'IsRestricted'))],[sectionLabels.direct,bootstrap.Channels.filter(channel=>value(channel,'IsPrivate'))],[sectionLabels.groups,bootstrap.Channels.filter(channel=>!value(channel,'IsPrivate')&&value(channel,'IsRestricted'))]];groups.forEach(([label,channels])=>{if(!channels.length)return;const heading=document.createElement('h3');heading.className='channel-heading';heading.textContent=label;list.appendChild(heading);channels.forEach(channel=>{const button=document.createElement('button');button.type='button';button.className='channel'+(active&&value(active,'Id')===value(channel,'Id')?' active':'');const strong=document.createElement('strong');const kind=value(channel,'Kind');strong.textContent=(kind==='Announcement'||kind==='RestrictedAnnouncement'?'📣 ':value(channel,'IsPrivate')?'💬 ':'# ')+channelName(channel);const small=document.createElement('small');small.textContent=channelDescription(channel);button.append(strong,small);button.addEventListener('click',()=>selectChannel(channel));list.appendChild(button)})})}
function setComposer(){const announcement=active&&['Announcement','RestrictedAnnouncement'].includes(value(active,'Kind'))&&!bootstrap.IsAdministrator;const restrictedWaiting=active&&value(active,'IsRestricted')&&!participantsReady;const disabled=bootstrap.IsMuted||announcement||restrictedWaiting||!active||secureState!=='ready';body.disabled=disabled;send.disabled=disabled;notice.className='notice';notice.textContent=bootstrap.IsMuted?text.muted:announcement?text.announcement:restrictedWaiting?text.privateWaiting:secureState==='waiting'?text.waiting:''}
function updateAvatar(channel){avatar.hidden=true;avatar.removeAttribute('src');closePrivate.hidden=!value(channel,'IsPrivate');blockPrivate.hidden=!value(channel,'IsPrivate');if(!value(channel,'IsPrivate'))return;const otherId=(value(channel,'MemberUserIds')||[]).find(id=>String(id).toLowerCase()!==String(bootstrap.CurrentUserId).toLowerCase());if(!otherId)return;avatar.src=client().getUrl(`Users/${encodeURIComponent(otherId)}/Images/Primary`);avatar.hidden=false}
blockPrivate.addEventListener('click',async()=>{if(!active||!value(active,'IsPrivate'))return;const otherId=(value(active,'MemberUserIds')||[]).find(id=>String(id).toLowerCase()!==String(bootstrap.CurrentUserId).toLowerCase());if(!otherId)return;try{await request(`JellyfinChat/Blocks/${encodeURIComponent(otherId)}`,{type:'POST'});bootstrap.Channels=bootstrap.Channels.filter(channel=>value(channel,'Id')!==value(active,'Id'));active=bootstrap.Channels[0]||null;if(active)await selectChannel(active);else{updateAvatar({});nameNode.textContent=text.brand;description.textContent='';security.textContent='';messages.textContent=text.empty;renderChannels();setComposer()}}catch(error){notice.className='notice error';notice.textContent=lang==='de'?'Der Benutzer konnte nicht blockiert werden.':'The user could not be blocked.'}});
closePrivate.addEventListener('click',async()=>{if(!active||!value(active,'IsPrivate')||!await confirmPrivateDeletion())return;const deletedId=value(active,'Id');try{await request(`JellyfinChat/PrivateChat/${encodeURIComponent(deletedId)}`,{type:'DELETE'});bootstrap.Channels=bootstrap.Channels.filter(channel=>value(channel,'Id')!==deletedId);active=bootstrap.Channels[0]||null;if(active)await selectChannel(active);else{closePrivate.hidden=true;avatar.hidden=true;nameNode.textContent=text.brand;description.textContent='';security.textContent='';messages.textContent=text.empty;renderChannels();setComposer()}}catch(error){notice.className='notice error';notice.textContent=lang==='de'?'Der private Chat konnte nicht gelöscht werden.':'The private chat could not be deleted.'}});
async function selectChannel(channel){active=channel;nameNode.textContent=channelName(channel);description.textContent=channelDescription(channel);updateAvatar(channel);renderChannels();setComposer();await loadMessages()}
async function refreshChannels(){if(!isOpen()||!bootstrap||busy)return;try{const currentId=active&&value(active,'Id');const latest=await request('JellyfinChat/Bootstrap');latest.Channels=latest.Channels??latest.channels??[];bootstrap.Channels=latest.Channels;bootstrap.ShowEncryptionDetails=latest.ShowEncryptionDetails??latest.showEncryptionDetails??false;const updated=currentId&&bootstrap.Channels.find(channel=>value(channel,'Id')===currentId);if(updated){active=updated;nameNode.textContent=channelName(active);description.textContent=channelDescription(active);updateAvatar(active)}else if(active){active=bootstrap.Channels[0]||null;if(active)await selectChannel(active);else{closePrivate.hidden=true;avatar.hidden=true;nameNode.textContent=text.brand;description.textContent='';security.textContent='';messages.textContent=text.empty}}renderChannels();setComposer()}catch(error){console.error('Jellyfin Chat: channel refresh failed',error)}}
function scheduleChannelRefresh(){if(channelTimer)window.clearTimeout(channelTimer);channelTimer=window.setTimeout(async()=>{if(isOpen())await refreshChannels();scheduleChannelRefresh()},5000)}
function action(label,onClick){const button=document.createElement('button');button.type='button';button.className='mini';button.textContent=label;button.addEventListener('click',onClick);return button}
function renderMessages(items){const nearBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<100;messages.replaceChildren();if(!items.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=secureState==='waiting'?text.waiting:text.empty;messages.appendChild(empty);return}items.forEach(item=>{const card=document.createElement('article');card.className='message';const head=document.createElement('div');head.className='message-head';const author=document.createElement('span');author.className='message-author';author.textContent=value(item,'AuthorName');const time=document.createElement('time');time.className='message-time';time.textContent=new Date(value(item,'CreatedAtUtc')).toLocaleString(lang==='de'?'de-DE':'en-US');const lock=document.createElement('span');lock.className='encrypted-mark';lock.textContent='🔒';lock.title=text.secure;head.append(author,time,lock);const authorId=value(item,'AuthorId');const ownMessage=String(authorId||'').toLowerCase()===String(bootstrap.CurrentUserId||'').toLowerCase();if(ownMessage||bootstrap.IsAdministrator){const actions=document.createElement('span');actions.className='message-actions';actions.append(action(text.delete,async()=>{if(!await confirmDialog(text.delete,text.confirmDelete,text.delete))return;await encryptedClient.deleteMessage(value(item,'Id'));loadMessages()}));if(bootstrap.IsAdministrator&&authorId&&!ownMessage)actions.append(action(text.mute,async()=>{if(!await confirmDialog(text.mute,text.confirmMute,text.mute))return;await request('JellyfinChat/Mutes',{type:'POST',data:{UserId:authorId,UserName:value(item,'AuthorName'),Reason:''}})}));head.appendChild(actions)}const content=document.createElement('div');content.className='message-body';content.textContent=value(item,'Body');card.append(head,content);messages.appendChild(card)});if(nearBottom)messages.scrollTop=messages.scrollHeight}
function isOpen(){if(document.visibilityState==='hidden')return false;try{const frame=window.frameElement;if(!frame)return true;if(frame.hidden||frame.getAttribute('aria-hidden')==='true'||frame.offsetParent===null)return false;const pane=frame.closest('[id^="customTab_"]');if(pane&&(pane.hidden||pane.getAttribute('aria-hidden')==='true'||pane.offsetParent===null))return false;const rect=frame.getBoundingClientRect();return rect.width>0&&rect.height>0}catch(_){return true}}
async function loadMessages(){if(!isOpen()||!active||busy||!encryptedClient)return;busy=true;try{const result=await encryptedClient.sync(value(active,'Id'));secureState=result.status;participantsReady=result.allParticipantsReady!==false;const details=bootstrap.ShowEncryptionDetails?` · MLS 1.0 · ${lang==='de'?'experimentell':'experimental'} · ${result.memberCount} ${text.devices} · ${text.code}: ${result.securityCode}`:'';security.textContent=secureState==='ready'?`🔒 ${lang==='de'?'Ende-zu-Ende-verschlüsselt':'End-to-end encrypted'}${details}`:text.waiting;security.className='security'+(secureState==='waiting'?' waiting':'');renderMessages(result.messages);setComposer()}catch(error){console.error('Jellyfin Chat: encrypted load failed',error);const message=errorText(error);messages.textContent=message;security.textContent=message;security.className='security waiting';secureState='error';setComposer()}finally{busy=false}}
function schedulePoll(){if(timer)window.clearTimeout(timer);const delay=bootstrap?(bootstrap.PollIntervalMilliseconds??bootstrap.pollIntervalMilliseconds??1000):500;timer=window.setTimeout(async()=>{if(isOpen()){if(!initialized)await initialize();else await loadMessages()}schedulePoll()},delay)}
async function initialize(){if(initialized||!isOpen())return;initialized=true;try{bootstrap=await request('JellyfinChat/Bootstrap');bootstrap.Channels=bootstrap.Channels??bootstrap.channels??[];bootstrap.IsAdministrator=bootstrap.IsAdministrator??bootstrap.isAdministrator??false;bootstrap.IsMuted=bootstrap.IsMuted??bootstrap.isMuted??false;bootstrap.IsEnabled=bootstrap.IsEnabled??bootstrap.isEnabled??false;bootstrap.ShowEncryptionDetails=bootstrap.ShowEncryptionDetails??bootstrap.showEncryptionDetails??false;bootstrap.MessageLimit=bootstrap.MessageLimit??bootstrap.messageLimit??1000;bootstrap.CurrentUserId=bootstrap.CurrentUserId??bootstrap.currentUserId;bootstrap.CurrentUserName=bootstrap.CurrentUserName??bootstrap.currentUserName;body.maxLength=bootstrap.MessageLimit;if(!bootstrap.IsEnabled){messages.textContent=text.disabled;body.disabled=true;send.disabled=true;return}if(!window.JellyfinChatE2EE?.createClient)throw new Error('The encrypted chat client is unavailable.');encryptedClient=await window.JellyfinChatE2EE.createClient({api:request,userId:bootstrap.CurrentUserId,userName:bootstrap.CurrentUserName,messageLimit:bootstrap.MessageLimit});if(bootstrap.Channels.length)await selectChannel(bootstrap.Channels[0]);else renderChannels();scheduleChannelRefresh()}catch(error){initialized=false;console.error('Jellyfin Chat: initialization failed',error);const message=errorText(error);messages.textContent=message;security.textContent=message;security.className='security waiting';secureState='error';setComposer()}}
form.addEventListener('submit',async event=>{event.preventDefault();const message=body.value.trim();if(!message||!active||!encryptedClient)return;send.disabled=true;send.textContent=text.sending;notice.textContent='';try{await encryptedClient.send(value(active,'Id'),message);body.value='';await loadMessages()}catch(error){console.error('Jellyfin Chat: encrypted send failed',error);notice.className='notice error';notice.textContent=text.sendFailed+errorDetail(error)}finally{send.textContent=text.send;setComposer()}});
body.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});window.addEventListener('beforeunload',()=>{if(timer)clearTimeout(timer);if(channelTimer)clearTimeout(channelTimer)});document.addEventListener('visibilitychange',()=>{if(isOpen()&&!initialized)initialize()});schedulePoll();
})();
</script>
</body></html>
